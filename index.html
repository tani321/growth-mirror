<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Me Grow — Feedback</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap');

:root{
  --cream: #FBF7F3;
  --blush: #F6E4EA;
  --lavender: #E6DEF4;
  --rose: #C8809A;
  --rose-deep: #A85C79;
  --plum: #4A3B52;
  --plum-soft: #7A6B84;
  --gold: #D4AF7A;
  --line: rgba(74,59,82,0.12);
  --radius: 22px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  font-family:'Manrope', sans-serif;
  color:var(--plum);
  background:
    radial-gradient(circle at 15% 10%, var(--blush) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, var(--lavender) 0%, transparent 45%),
    var(--cream);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
  overflow-x:hidden;
}

.stage{
  width:100%;
  max-width:640px;
  position:relative;
}

/* ambient sparkles */
.sparkle{
  position:fixed;
  pointer-events:none;
  opacity:0.55;
  z-index:0;
}
.sparkle svg{width:100%; height:100%;}

/* ---- progress bloom ---- */
.bloom-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
  position:relative;
  z-index:2;
}
.bloom{ width:76px; height:76px; }
.petal{
  fill: var(--line);
  stroke: var(--rose);
  stroke-width: 0.5;
  transition: fill 0.5s ease, opacity 0.5s ease;
  transform-origin: 40px 40px;
}
.petal.on{ fill: var(--rose); }
.bloom-center{ fill: var(--gold); }
.bloom-label{
  text-align:center;
  font-size:12.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--plum-soft);
  margin-bottom:28px;
  font-weight:600;
}

/* ---- card ---- */
.card{
  background:#fffdfb;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:44px 40px;
  box-shadow: 0 24px 60px -30px rgba(168,92,121,0.35);
  position:relative;
  z-index:2;
  min-height:300px;
  animation: rise 0.55s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{
  from{ opacity:0; transform: translateY(14px); }
  to{ opacity:1; transform: translateY(0); }
}

/* welcome page */
.eyebrow{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:500;
  color:var(--rose-deep);
  font-size:15px;
  margin-bottom:6px;
  text-align:center;
}
.title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:34px;
  line-height:1.15;
  text-align:center;
  margin-bottom:6px;
  color:var(--plum);
}
.subtitle{
  text-align:center;
  color:var(--plum-soft);
  font-size:15px;
  margin-bottom:22px;
}
.quote{
  font-family:'Fraunces', serif;
  font-style:italic;
  text-align:center;
  color:var(--rose-deep);
  font-size:16px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:16px 8px;
  margin:22px 0;
}
.welcome-body{
  font-size:15.5px;
  line-height:1.75;
  color:var(--plum-soft);
}
.welcome-body p{ margin-bottom:14px; }
.welcome-body strong{ color:var(--plum); font-weight:600; }

/* section header */
.section-eyebrow{
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--rose-deep);
  font-weight:700;
  margin-bottom:6px;
}
.section-title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:26px;
  margin-bottom:26px;
  color:var(--plum);
}

/* questions */
.question{ margin-bottom:30px; }
.question:last-child{ margin-bottom:6px; }
.q-text{
  font-size:15.5px;
  font-weight:600;
  margin-bottom:12px;
  color:var(--plum);
  line-height:1.4;
}
.q-hint{
  font-size:12px;
  color:var(--plum-soft);
  font-weight:400;
  margin-left:6px;
}
.options{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
.opt{
  padding:9px 16px;
  border-radius:100px;
  border:1px solid var(--line);
  background:#fff;
  font-size:13.5px;
  color:var(--plum-soft);
  cursor:pointer;
  user-select:none;
  transition: all 0.18s ease;
  font-weight:500;
}
.opt:hover{ border-color:var(--rose); color:var(--plum); }
.opt.selected{
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  border-color: var(--rose-deep);
  color:#fff;
  box-shadow: 0 6px 16px -6px rgba(168,92,121,0.55);
}
.opt.locked{
  opacity:0.4;
  cursor:not-allowed;
}
.opt.locked:hover{ border-color:var(--line); color:var(--plum-soft); }

/* nav */
.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:34px;
  position:relative;
  z-index:2;
}
.btn{
  font-family:'Manrope', sans-serif;
  font-weight:700;
  font-size:14px;
  padding:13px 26px;
  border-radius:100px;
  border:none;
  cursor:pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  letter-spacing:0.01em;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  color:#fff;
  box-shadow: 0 10px 24px -10px rgba(168,92,121,0.6);
}
.btn-primary:hover{ box-shadow: 0 14px 28px -10px rgba(168,92,121,0.7); }
.btn-ghost{
  background:transparent;
  color:var(--plum-soft);
  border:1px solid var(--line);
}
.btn-ghost:hover{ color:var(--plum); border-color:var(--rose); }
.btn:disabled{
  opacity:0.7;
  cursor:not-allowed;
  transform:none !important;
}

/* inline loading spinner shown inside the Submit button */
.btn-spinner{
  display:inline-block;
  width:13px;
  height:13px;
  border:2px solid rgba(255,255,255,0.5);
  border-top-color:#fff;
  border-radius:50%;
  animation: spin 0.7s linear infinite;
  margin-right:8px;
  vertical-align:middle;
}
@keyframes spin{
  to{ transform: rotate(360deg); }
}

/* submission error banner with retry */
.submit-error{
  margin-top:22px;
  text-align:center;
  padding:18px 20px;
  border-radius:16px;
  background: rgba(200,80,90,0.07);
  border:1px solid rgba(200,80,90,0.25);
  animation: rise 0.4s ease;
}
.submit-error p{
  color:#9C4A52;
  font-size:14px;
  line-height:1.6;
  margin-bottom:14px;
  font-weight:500;
}
.btn-full{ width:100%; }
.nav-spacer{ flex:1; }

/* thank you page */
.thankyou{
  text-align:center;
  padding:20px 4px;
}
.thankyou .title{ font-size:32px; margin-bottom:18px; }
.thankyou p{
  color:var(--plum-soft);
  font-size:15.5px;
  line-height:1.75;
  margin-bottom:12px;
}
.bows{
  font-size:22px;
  margin:20px 0;
  letter-spacing:10px;
}

/* already-submitted notice */
.submitted-notice{
  margin-top:24px;
  text-align:center;
  padding:22px 20px;
  border-radius:16px;
  background: linear-gradient(135deg, rgba(200,128,154,0.08), rgba(230,222,244,0.35));
  border:1px solid var(--line);
}
.submitted-notice p{
  color:var(--plum-soft);
  font-size:14.5px;
  line-height:1.6;
  margin-bottom:16px;
}

/* fade transitions between steps handled by .card animation re-trigger via key */
.hidden{ display:none; }

@media (max-width: 480px){
  .card{ padding:32px 22px; }
  .title{ font-size:27px; }
  .section-title{ font-size:22px; }
}
</style>
</head>
<body>

<div class="stage">

  <div class="bloom-wrap">
    <svg class="bloom" viewBox="0 0 80 80" id="bloomSvg">
      <!-- 7 petals: welcome + 6 sections; thank-you = fully bloomed -->
      <g id="petals"></g>
      <circle class="bloom-center" cx="40" cy="40" r="7"></circle>
    </svg>
  </div>
  <div class="bloom-label" id="bloomLabel">Welcome</div>

  <div class="card" id="card"></div>

  <div class="nav" id="navRow"></div>

</div>

<script>
/* ---------------- data ---------------- */
const sections = [
  {
    key: "s1", title: "First Impression", eyebrow: "Section 1",
    questions: [
      { id:"q1", type:"multi", text:"What was your first impression of me?",
        options:["Confident","Friendly","Intelligent","Mature","Childish","Quiet","Funny","Serious","Professional","Reserved"] },
      { id:"q2", type:"multi", text:"How would you describe me now?",
        options:["Confident","Mature","Friendly","Intelligent","Professional","Childish","Responsible","Ambitious","Funny","Genuine"] },
      { id:"q3", type:"single", text:"Compared to when we first met, I have...",
        options:["Improved a lot","Improved slightly","Stayed the same","Become slightly worse","Become much worse"] },
      { id:"q4", type:"single", text:"After talking to me, your opinion of me generally...",
        options:["Improved a lot","Improved slightly","Stayed the same","Became slightly worse","Became much worse"] },
    ]
  },
  {
    key:"s2", title:"Personality & Communication", eyebrow:"Section 2",
    questions:[
      { id:"q5", type:"multi", max:3, text:"Which quality stands out the most?",
        options:["Confidence","Intelligence","Kindness","Leadership","Creativity","Communication","Hardworking nature","Positivity","Discipline","Humor"] },
      { id:"q6", type:"multi", max:3, text:"Which area needs the most improvement?",
        options:["Confidence","Communication","Emotional maturity","Professionalism","Leadership","Listening skills","Consistency","Time management","Decision making","Emotional control"] },
      { id:"q7", type:"multi", max:3, text:"Do I come across as mature?",
        options:["Always","Most of the time","Sometimes","Rarely","Never"] },
      { id:"q8", type:"multi", max:3, text:"Do I come across as childish?",
        options:["Never","Rarely","Sometimes","Often","Very Often"] },
      { id:"q9", type:"multi", max:3, text:"How confident do I appear?",
        options:["Very confident","Confident","Neutral","Slightly insecure","Very insecure"] },
      { id:"q10", type:"multi", max:3, text:"How good are my communication skills?",
        options:["Excellent","Good","Average","Needs improvement","Poor"] },
      { id:"q11", type:"multi", max:3, text:"How approachable am I?",
        options:["Very approachable","Approachable","Neutral","Slightly intimidating","Very intimidating"] },
    ]
  },
  {
    key:"s3", title:"Conversations & Personal Image", eyebrow:"Section 3",
    questions:[
      { id:"q12", type:"multi", max:3, text:"During conversations, I come across as...",
        options:["Mature","Professional","Friendly","Intelligent","Childish","Funny","Curious","Confident","Insecure","Thoughtful"] },
      { id:"q13", type:"multi", max:3, text:"What changes your perception of me the most after we talk?",
        options:["I seem more mature","I seem less mature","I seem more confident","I seem less confident","I appear more intelligent","I talk too much","I become more friendly","No major change"] },
      { id:"q14", type:"multi", max:3, text:"What is one thing that reduces my overall impression?",
        options:["Talking too much","Talking too little","Childish behavior","Lack of confidence","Poor communication","Overthinking","Lack of seriousness","Nothing reduces it"] },
      { id:"q15", type:"multi", max:3, text:"What is one thing that improves my impression after talking?",
        options:["Intelligence","Kindness","Confidence","Communication","Humor","Ambition","Positivity","Leadership"] },
      { id:"q16", type:"multi", max:3, text:"Do I speak like someone who is...",
        options:["A school student","A college student","Internship-ready","A working professional","A future leader"] },
      { id:"q17", type:"multi", max:3, text:"Which habit affects my image the most?",
        options:["Talking too fast","Talking too much","Interrupting others","Not listening enough","Making too many jokes","Being too quiet","Overthinking before speaking","None of these"] },
    ]
  },
  {
    key:"s4", title:"Professionalism & Work Ethic", eyebrow:"Section 4",
    questions:[
      { id:"q18", type:"multi", max:3, text:"How would you rate my professionalism?",
        options:["Excellent","Good","Average","Needs improvement","Poor"] },
      { id:"q19", type:"multi", max:3, text:"If you met me in a professional setting, would you trust me with responsibility?",
        options:["Definitely","Probably","Maybe","Probably not","Definitely not"] },
      { id:"q20", type:"multi", max:3, text:"Do I seem like someone who finishes what they start?",
        options:["Always","Usually","Sometimes","Rarely","Never"] },
      { id:"q21", type:"multi", max:3, text:"If you had to choose one role for me, what would it be?",
        options:["Team Leader","Problem Solver","Technical Expert","Creative Thinker","Reliable Support","Communicator","Organizer/Planner","Entrepreneur"] },
    ]
  },
  {
    key:"s5", title:"Career & Future Potential", eyebrow:"Section 5",
    questions:[
      { id:"q22", type:"single", text:"Which career level do I currently come across as?",
        options:["Still exploring","College student with potential","Internship-ready","Job-ready professional","Future leader"] },
      { id:"q23", type:"single", text:"If I continue improving, what do you think I'll become?",
        options:["Strong Technical Expert","Team Leader","Manager","Entrepreneur","Researcher/Innovator","Industry Expert","Successful Professional","Not sure yet"] },
    ]
  },
  {
    key:"s6", title:"Overall Perception", eyebrow:"Section 6",
    questions:[
      { id:"q24", type:"single", text:"After spending more time with me, your respect for me...",
        options:["Increased a lot","Increased slightly","Stayed the same","Decreased slightly","Decreased a lot"] },
      { id:"q25", type:"single", text:"If you had to introduce me to someone else, which sentence would fit best?",
        options:["A mature and dependable person.","Someone with strong leadership potential.","A hardworking and ambitious individual.","A creative and intelligent thinker.","A fun and positive person to be around.","A reliable teammate.","Someone who is still growing and has great potential.","A confident professional in the making."] },
    ]
  },
];

/* ============================================================
   GOOGLE SHEETS INTEGRATION
   Paste your deployed Apps Script Web App URL below.
   (See deployment instructions provided separately.)
   ============================================================ */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3dXbvQl-nJJjYWmR0fUxdeAc6ar8vBHQj4M64TbMkkGnehC9-Y6PEQCKZREQxzFQc/exec";

/* total steps: 0 = welcome, 1..6 = sections, 7 = thank you */
const TOTAL_STEPS = sections.length + 2;
let step = 0;
let alreadySubmitted = false;
let isSubmitting = false;   // true while the network request is in flight
let submitError = null;     // holds an error message string, or null
const answers = {}; // { qid: "value" or ["v1","v2"] }

/* ---------------- send answers to Google Sheets ---------------- */
async function handleSubmit(){
  isSubmitting = true;
  submitError = null;
  render();

  try {
    const response = await fetch(WEB_APP_URL, {
      method: "POST",
      // text/plain avoids a CORS preflight request against Apps Script.
      // The body is still valid JSON — Code.gs parses it with JSON.parse().
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ answers })
    });

    if (!response.ok){
      throw new Error("Network response was not OK.");
    }

    const result = await response.json();

    if (!result.success){
      throw new Error(result.message || "The server rejected the submission.");
    }

    // Saved successfully — advance to the Thank You page and
    // set the persistent "already submitted" flag.
    isSubmitting = false;
    step++;
    await markSubmitted();
    render();

  } catch (err){
    // Keep the user on the last section, keep all answers intact,
    // and surface a friendly retry message.
    console.error("Submission error:", err);
    isSubmitting = false;
    submitError = "Something went wrong while submitting your feedback. Please check your internet connection and try again.";
    render();
  }
}

/* ---------------- persistent submission flag ---------------- */
async function checkSubmissionStatus(){
  try {
    const result = await window.storage.get('submitted', false);
    alreadySubmitted = !!(result && result.value === 'true');
  } catch (e){
    // key not found yet, or storage error — treat as not submitted
    alreadySubmitted = false;
  }
  render();
}

async function markSubmitted(){
  try {
    await window.storage.set('submitted', 'true', false);
    alreadySubmitted = true;
  } catch (e){
    console.error('Storage error while saving submission flag:', e);
  }
}

async function resetSubmission(){
  try {
    await window.storage.delete('submitted', false);
  } catch (e){
    console.error('Storage error while clearing submission flag:', e);
  }
  alreadySubmitted = false;
  step = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  render();
}

/* ---------------- render helpers ---------------- */
const card = document.getElementById("card");
const navRow = document.getElementById("navRow");
const bloomLabel = document.getElementById("bloomLabel");
const petalsGroup = document.getElementById("petals");

/* build 6 petals around the center, evenly spaced */
const numPetals = sections.length; // 6
for (let i = 0; i < numPetals; i++){
  const angle = (360 / numPetals) * i;
  const p = document.createElementNS("http://www.w3.org/2000/svg","ellipse");
  p.setAttribute("cx", "40");
  p.setAttribute("cy", "20");
  p.setAttribute("rx", "8.5");
  p.setAttribute("ry", "15");
  p.setAttribute("class","petal");
  p.setAttribute("transform", `rotate(${angle} 40 40)`);
  p.dataset.index = i;
  petalsGroup.appendChild(p);
}

function updateBloom(){
  const petals = petalsGroup.querySelectorAll(".petal");
  // number of "on" petals = number of sections fully passed (step-1 if in/after section i)
  let onCount = 0;
  if (step === 0) onCount = 0;
  else if (step >= 1 && step <= sections.length) onCount = step - 1; // completed sections before current
  else onCount = sections.length; // thank you page: full bloom

  petals.forEach((p, i) => {
    p.classList.toggle("on", i < onCount);
  });

  if (step === 0) bloomLabel.textContent = "Welcome";
  else if (step >= 1 && step <= sections.length) bloomLabel.textContent = `Section ${step} of ${sections.length}`;
  else bloomLabel.textContent = "Complete";
}

function toggleOption(qid, value, type, max){
  if (type === "single"){
    answers[qid] = value;
  } else {
    if (!answers[qid]) answers[qid] = [];
    const arr = answers[qid];
    const idx = arr.indexOf(value);
    if (idx === -1){
      if (max && arr.length >= max) return; // limit reached, ignore new selection
      arr.push(value);
    } else {
      arr.splice(idx,1);
    }
  }
  render();
}

function renderQuestion(q){
  const selected = answers[q.id];
  const isSelected = (opt) => q.type === "single" ? selected === opt : (selected && selected.includes(opt));
  const atMax = q.type === "multi" && q.max && selected && selected.length >= q.max;
  const optsHtml = q.options.map(opt => {
    const sel = isSelected(opt);
    const locked = atMax && !sel;
    return `<div class="opt ${sel ? 'selected' : ''} ${locked ? 'locked' : ''}" data-qid="${q.id}" data-type="${q.type}" data-max="${q.max || ''}" data-value="${opt.replace(/"/g,'&quot;')}">${opt}</div>`;
  }).join("");
  const hint = q.type === "multi" ? `<span class="q-hint">(choose 2–${q.max || 3})</span>` : '';
  return `
    <div class="question">
      <div class="q-text">${q.text} ${hint}</div>
      <div class="options">${optsHtml}</div>
    </div>
  `;
}

function render(){
  card.innerHTML = "";
  navRow.innerHTML = "";
  updateBloom();

  if (step === 0){
    // Welcome page
    card.innerHTML = `
      <div class="eyebrow">🌱 Help Me Grow</div>
      <div class="title">Anonymous Personality &<br>Professional Growth Feedback</div>
      <div class="quote">"Growth begins where honest feedback meets an open mind."</div>
      <div class="welcome-body">
        <p>Hi! 👋</p>
        <p>Thank you for taking a few minutes to complete this anonymous feedback form.</p>
        <p>I'm currently on a journey to become a better version of myself — not only as a friend, teammate, and student, but also as a future professional and leader.</p>
        <p>We all have strengths, but we also have blind spots that we often can't see ourselves.</p>
        <p>Your honest feedback will help me understand how others genuinely perceive me, identify areas where I can improve, and continue growing into someone who is more <strong>mature, confident, professional, and kind</strong>.</p>
        <p>There are no right or wrong answers. Please answer honestly.<br>Your responses are completely anonymous.</p>
        <p>Thank you for helping me grow. 🌱💗</p>
      </div>
    `;
    navRow.innerHTML = alreadySubmitted
      ? ""
      : `<button class="btn btn-primary btn-full" id="startBtn">Start →</button>`;

    if (alreadySubmitted){
      const notice = document.createElement("div");
      notice.className = "submitted-notice";
      notice.innerHTML = `
        <p>You have already submitted a response from this browser.</p>
        <button class="btn btn-primary btn-full" id="newResponseBtn">Start a New Response</button>
      `;
      card.appendChild(notice);
      document.getElementById("newResponseBtn").onclick = () => { resetSubmission(); };
    } else {
      document.getElementById("startBtn").onclick = () => { step = 1; render(); };
    }
    return;
  }

  if (step >= 1 && step <= sections.length){
    const s = sections[step - 1];
    card.innerHTML = `
      <div class="section-eyebrow">${s.eyebrow}</div>
      <div class="section-title">${s.title}</div>
      ${s.questions.map(renderQuestion).join("")}
    `;
    card.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => toggleOption(el.dataset.qid, el.dataset.value, el.dataset.type, el.dataset.max ? parseInt(el.dataset.max) : null);
    });

    const isFirstSection = step === 1;
    const isLastSection = step === sections.length;

    // Submit button label/state changes while a request is in flight.
    const submitLabel = isSubmitting
      ? `<span class="btn-spinner"></span> Submitting your feedback...`
      : "Submit 💗";

    navRow.innerHTML = `
      ${isFirstSection ? '<span class="nav-spacer"></span>' : `<button class="btn btn-ghost" id="prevBtn" ${isSubmitting ? 'disabled' : ''}>← Previous</button>`}
      <button class="btn btn-primary" id="nextBtn" ${isSubmitting ? 'disabled' : ''}>${isLastSection ? submitLabel : "Next →"}</button>
    `;

    if (!isFirstSection) document.getElementById("prevBtn").onclick = () => { if (!isSubmitting){ step--; render(); } };
    document.getElementById("nextBtn").onclick = () => {
      if (isSubmitting) return; // guard against double-clicks
      if (isLastSection){
        handleSubmit();
      } else {
        step++;
        render();
      }
    };

    // Error banner with retry, shown below the card content when a submit attempt fails.
    if (isLastSection && submitError){
      const errBox = document.createElement("div");
      errBox.className = "submit-error";
      errBox.innerHTML = `
        <p>${submitError}</p>
        <button class="btn btn-primary" id="retryBtn">Retry</button>
      `;
      card.appendChild(errBox);
      document.getElementById("retryBtn").onclick = () => { handleSubmit(); };
    }

    return;
  }

  // Thank you page
  card.innerHTML = `
    <div class="thankyou">
